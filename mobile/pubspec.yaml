name: medcin
description: A healthcare booking platform mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP Client
  http: ^1.1.0
  
  # Better Auth Flutter SDK
  better_auth_flutter: ^0.0.7
  
  # Secure Storage for tokens
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  cached_network_image: ^4.0.4
  intl: ^0.20.3
  intl_phone_field: ^3.2.0
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  riverpod: ^3.4.3
  device_info_plus: ^12.4.0
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
